name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # O cliente do Prisma (generated/prisma) não é versionado: precisa ser gerado antes de testar/compilar.
      - name: Gerar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (Sass)
        run: npm run build
